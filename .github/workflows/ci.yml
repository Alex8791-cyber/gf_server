name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy-checks:
    name: Deploy toolchain checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          set -e
          for s in deploy/install.sh deploy/gfctl deploy/gf-backup.sh \
                   deploy/ip-patch.sh deploy/lib/common.sh deploy/tests/*.sh; do
            bash -n "$s"
            echo "ok: $s"
          done

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -x --severity=warning \
            deploy/install.sh deploy/gfctl deploy/gf-backup.sh \
            deploy/ip-patch.sh deploy/lib/common.sh deploy/tests/*.sh

      - name: systemd unit verify
        run: |
          set -e
          # Stub the binaries the units reference so `systemd-analyze verify`
          # is deterministic (no false "executable path" failures).
          sudo mkdir -p /opt/gfserver/deploy
          for d in TicketServer GatewayServer LoginServer MissionServer WorldServer ZoneServer; do
            sudo mkdir -p "/opt/gfserver/$d"
            printf '#!/bin/sh\n' | sudo tee "/opt/gfserver/$d/$d" >/dev/null
            sudo chmod 755 "/opt/gfserver/$d/$d"
          done
          sudo install -m 755 deploy/gf-backup.sh /opt/gfserver/deploy/gf-backup.sh
          for u in deploy/systemd/*; do
            echo "== verify $u =="
            systemd-analyze verify "$u"
          done

      - name: IP-patch unit test
        run: bash deploy/tests/test-ip-patch.sh

  web-backend:
    name: Web backend tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create databases
        run: |
          for db in gf_gs gf_ls gf_ms; do
            psql -h localhost -U postgres -c "CREATE DATABASE ${db} ENCODING 'UTF8' TEMPLATE template0;"
          done

      - name: Load game schema
        run: |
          for db in gf_gs gf_ls gf_ms; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -d "${db}" -f "_utils/db/${db}.sql"
          done

      - name: Create gf_web role
        run: psql -h localhost -U postgres -c "CREATE ROLE gf_web LOGIN PASSWORD 'testpw';"

      - name: Apply migrations
        run: GF_PSQL="psql -h localhost -U postgres" GF_ROOT="$PWD" bash deploy/migrate.sh

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql
          tools: composer

      - name: Install Composer dependencies
        working-directory: web
        run: composer install --no-interaction --no-progress

      - name: Run PHPUnit
        working-directory: web
        env:
          GF_DB_HOST: localhost
          GF_DB_PORT: '5432'
          GF_DB_USER: gf_web
          GF_DB_PASSWORD: testpw
          GF_ADMIN_HOST: localhost
          GF_ADMIN_PORT: '5432'
          GF_ADMIN_USER: postgres
          GF_ADMIN_PASSWORD: postgres
        run: vendor/bin/phpunit
